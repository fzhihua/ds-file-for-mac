<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DS File for Mac · 设置</title><link rel="stylesheet" href="style.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><main class="panel">
  <div class="eyebrow">DS File for Mac · 非官方</div>
  <h1>播放设置</h1>
  <p class="small">先在 Chrome 打开自己的群晖 File Station，点击扩展图标，再点“授权当前 NAS”。插件将从网址自动识别 NAS 域名、协议和端口。</p>
  <p class="small" id="detected">检测当前标签页……</p>
  <div class="controls"><button id="grant" class="primary" type="button">授权当前 NAS</button></div>
  <label>或者手动填写 NAS 入口（仅当前站点）<input id="nasOrigin" placeholder="https://nas.example.com:5001" autocomplete="off" spellcheck="false"></label>
  <p id="sites" class="small">尚未授权 NAS 站点</p>
  <label class="check"><input type="checkbox" id="enabled"> 自动截获已授权 NAS 的播放器跳转</label>
  <label class="check"><input type="checkbox" id="autoOpen"> 自动启动 IINA</label>
  <label class="check"><input type="checkbox" id="autoClose"> IINA 接管后关闭临时交接标签</label>
  <div class="controls"><button type="button" id="clear">清除临时 SID</button><button type="button" id="removeSite">移除当前 NAS 授权</button></div>
  <p class="warning">授权仅限你选择的 NAS 主机。HTTP 会暴露 SID/密码；推荐使用可信 HTTPS。SID 仍可能出现在 IINA 视频 URL 中，请勿分享播放链接。</p>
  <p id="status" class="notice" role="status">正在读取设置……</p>
  <p class="small">需要 IINA 1.4.4 或更新版本。未经 Synology 或 IINA 官方认可。</p>
</main></body></html>
